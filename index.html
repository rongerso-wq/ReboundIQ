<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#001965" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; manifest-src 'none'; media-src 'none'" />
  <title>ReboundIQ — Novo Nordisk AI Maintenance Companion</title>

  <link rel="stylesheet" href="vendor/fonts/google-fonts.css" />

  <script src="vendor/tailwind.min.js"></script>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <style>
    :root {
      --nn-navy:      #001965;
      --nn-navy-2:    #00103F;
      --nn-blue:      #0066B3;
      --nn-blue-2:    #003C75;
      --nn-ink:       #0E1631;
      --nn-ink-soft:  #4A526C;
      --nn-ink-dim:   #6F778F;
      --nn-bg:        #FFFFFF;
      --nn-bg-2:      #F7F7F2;
      --nn-bg-3:      #EEEEE6;
      --nn-hair:      #DCDCD4;
      --nn-hair-2:    #ECEBE3;
      --nn-good:      #2E7D55;
      --nn-warn:      #B57814;
      --nn-bad:       #B43A2A;
    }

    html, body { background: var(--nn-bg); color: var(--nn-ink); }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-feature-settings: 'cv11', 'ss01', 'ss03';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.005em;
    }

    .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' on; }

    /* Editorial display type — sized for the hero */
    .display {
      font-weight: 400;
      letter-spacing: -0.022em;
      line-height: 1.04;
      color: var(--nn-navy);
    }
    .display em { font-style: normal; color: var(--nn-ink-soft); }

    /* Section eyebrow — used above every section heading */
    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--nn-blue);
    }

    /* Hairline rule */
    .hair-top    { border-top: 1px solid var(--nn-hair); }
    .hair-bottom { border-bottom: 1px solid var(--nn-hair); }

    /* Utility strip (very top) */
    .utility-strip {
      background: var(--nn-navy);
      color: rgba(255,255,255,0.86);
      font-size: 11.5px;
      letter-spacing: 0.02em;
    }
    .utility-strip a { color: rgba(255,255,255,0.86); }
    .utility-strip a:hover { color: #fff; }

    /* Header / nav */
    .nav-link {
      position: relative;
      padding: 22px 0;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--nn-ink);
      letter-spacing: 0.005em;
      white-space: nowrap;
    }
    .nav-link:hover { color: var(--nn-navy); }
    .nav-link.active { color: var(--nn-navy); font-weight: 600; }
    .nav-link.active::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 2px;
      background: var(--nn-navy);
    }
    .nav-link .idx {
      font-variant-numeric: tabular-nums;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--nn-ink-dim);
      margin-right: 8px;
    }
    .nav-link.active .idx { color: var(--nn-blue); }

    /* Mode toggle — Clinician / Patient, minimal underline tabs */
    .mode-btn {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      padding: 6px 2px;
      border-bottom: 1px solid transparent;
      transition: color 120ms, border-color 120ms;
    }
    .mode-btn:hover { color: rgba(255,255,255,0.85); }
    .mode-btn.active {
      color: #FFFFFF;
      border-color: rgba(255,255,255,0.85);
    }

    /* CTA buttons — Novo style: outlined + arrow link */
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 13.5px; font-weight: 500;
      padding: 14px 22px;
      border-radius: 0;
      transition: background 160ms, color 160ms, border-color 160ms, transform 160ms;
      letter-spacing: 0.005em;
    }
    .btn-primary {
      background: var(--nn-navy); color: #fff;
      border: 1px solid var(--nn-navy);
    }
    .btn-primary:hover { background: var(--nn-navy-2); border-color: var(--nn-navy-2); }
    .btn-ghost {
      background: transparent; color: var(--nn-navy);
      border: 1px solid var(--nn-navy);
    }
    .btn-ghost:hover { background: var(--nn-navy); color: #fff; }
    .arrow-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13.5px; font-weight: 500; color: var(--nn-navy);
      padding-bottom: 2px;
      border-bottom: 1px solid var(--nn-navy);
    }
    .arrow-link:hover { color: var(--nn-blue); border-color: var(--nn-blue); }

    /* Editorial number tag — used in feature cards */
    .num-tag {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--nn-ink-dim);
      letter-spacing: 0.04em;
    }

    /* Risk pills — restrained, dot + text only */
    .risk-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 4px 10px;
      border: 1px solid var(--nn-hair);
      border-radius: 999px;
      font-size: 11.5px;
      color: var(--nn-ink-soft);
      background: #fff;
    }
    .risk-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot-good { background: var(--nn-good); }
    .dot-warn { background: var(--nn-warn); }
    .dot-bad  { background: var(--nn-bad);  }

    /* Reference card */
    .ref-row {
      padding: 22px 0;
      border-top: 1px solid var(--nn-hair);
    }
    .ref-row:last-child { border-bottom: 1px solid var(--nn-hair); }

    /* Pull-quote stat */
    .stat-figure {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 56px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--nn-navy);
      font-variant-numeric: tabular-nums;
    }
    @media (min-width: 768px) { .stat-figure { font-size: 72px; } }
    /* Smaller variant — reserve the full 72px for the single hero metric per tab. */
    .stat-figure--small { font-size: 36px; }
    @media (min-width: 768px) { .stat-figure--small { font-size: 44px; } }

    /* Author signature — kept minimal in the footer */
    .signature {
      font-family: 'Caveat', cursive;
      font-size: 19px;
      color: var(--nn-ink-soft);
      letter-spacing: 0.01em;
    }

    /* ---------- Form primitives ---------- */
    .field-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--nn-ink-dim);
      display: block;
      margin-bottom: 10px;
    }
    .field-helper {
      font-size: 11.5px;
      color: var(--nn-ink-dim);
      margin-top: 6px;
      line-height: 1.45;
    }
    .field-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--nn-hair);
      font-size: 15px;
      font-family: inherit;
      color: var(--nn-ink);
      padding: 6px 0 9px;
      transition: border-color 160ms;
      font-variant-numeric: tabular-nums;
    }
    .field-input:focus {
      outline: none;
      border-bottom-color: var(--nn-navy);
      border-bottom-width: 1px;
    }
    .field-input::placeholder { color: var(--nn-ink-dim); opacity: 0.55; }
    .field-readonly {
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      padding: 6px 0 9px;
      border-bottom: 1px solid var(--nn-hair-2);
      color: var(--nn-ink);
    }

    /* Chip-style segmented selection */
    .chip {
      display: inline-flex; flex-direction: column; align-items: flex-start;
      gap: 2px;
      padding: 10px 14px;
      border: 1px solid var(--nn-hair);
      background: #fff;
      font-size: 13px;
      color: var(--nn-ink-soft);
      cursor: pointer;
      transition: background 160ms, color 160ms, border-color 160ms;
      white-space: nowrap;
      line-height: 1.25;
    }
    .chip:hover { border-color: var(--nn-ink-soft); color: var(--nn-ink); }
    .chip.active {
      border-color: var(--nn-navy);
      background: var(--nn-navy);
      color: #fff;
    }
    .chip .chip-sub {
      font-size: 10.5px;
      opacity: 0.65;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .chip.active .chip-sub { opacity: 0.75; }

    /* Toggle (boolean) — used for comorbidities */
    .toggle {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 13px 16px;
      border: 1px solid var(--nn-hair);
      background: #fff;
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: var(--nn-ink);
      transition: background 160ms, border-color 160ms;
      font-size: 13.5px;
    }
    .toggle:hover { border-color: var(--nn-ink-soft); }
    .toggle.active {
      border-color: var(--nn-navy);
      background: var(--nn-bg-2);
    }
    .toggle .toggle-dot {
      width: 16px; height: 16px;
      border: 1px solid var(--nn-hair);
      background: #fff;
      position: relative;
      flex-shrink: 0;
    }
    .toggle.active .toggle-dot {
      border-color: var(--nn-navy);
      background: var(--nn-navy);
    }
    .toggle.active .toggle-dot::after {
      content: ""; position: absolute;
      left: 5px; top: 1px; width: 4px; height: 9px;
      border: solid #fff; border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
    }

    /* Demo patient card */
    .demo-card {
      text-align: left;
      border: 1px solid var(--nn-hair);
      background: #fff;
      padding: 22px;
      cursor: pointer;
      transition: border-color 200ms, transform 200ms, box-shadow 200ms;
      display: flex; flex-direction: column;
      width: 100%;
    }
    .demo-card:hover {
      border-color: var(--nn-navy);
      transform: translateY(-2px);
      /* No box-shadow — editorial Novo rule (no shadows anywhere). */
    }

    /* Mobile tab strip — soft right-edge fade so users know it scrolls */
    .mobile-tab-strip {
      -webkit-mask-image: linear-gradient(to right, black 88%, transparent 100%);
              mask-image: linear-gradient(to right, black 88%, transparent 100%);
    }
    :root[dir="rtl"] .mobile-tab-strip {
      -webkit-mask-image: linear-gradient(to left, black 88%, transparent 100%);
              mask-image: linear-gradient(to left, black 88%, transparent 100%);
    }

    /* Trajectory chart — guarantee a readable label size on the smallest phones */
    .traj-chart-wrap { min-width: 480px; }
    @media (min-width: 480px) { .traj-chart-wrap { min-width: 0; } }
    .traj-chart-scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* Coach chat thread */
    .coach-thread {
      max-height: 540px;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 8px 0;
    }
    .coach-turn {
      padding: 22px 0;
      border-top: 1px solid var(--nn-hair-2);
    }
    .coach-turn:first-child { border-top: none; padding-top: 4px; }
    .coach-sender {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .coach-sender.you   { color: var(--nn-blue); }
    .coach-sender.coach { color: var(--nn-navy); }
    .coach-content {
      font-size: 15.5px;
      line-height: 1.65;
      color: var(--nn-ink);
      white-space: pre-wrap;
    }
    .coach-input {
      width: 100%;
      resize: vertical;
      min-height: 92px;
      padding: 16px 18px;
      border: 1px solid var(--nn-hair);
      background: #fff;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.55;
      color: var(--nn-ink);
      transition: border-color 160ms;
    }
    .coach-input:focus { outline: none; border-color: var(--nn-navy); }
    .coach-input:disabled { background: var(--nn-bg-2); cursor: not-allowed; }
    @media (max-width: 640px) {
      .coach-input { min-height: 64px; }
    }
    .coach-quickstart {
      display: inline-flex; align-items: center;
      padding: 10px 16px;
      border: 1px solid var(--nn-hair);
      background: #fff;
      font-size: 13px;
      color: var(--nn-ink-soft);
      cursor: pointer;
      transition: border-color 160ms, color 160ms;
      text-align: left;
    }
    .coach-quickstart:hover { border-color: var(--nn-navy); color: var(--nn-ink); }
    .coach-typing {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 13px;
      color: var(--nn-ink-dim);
      letter-spacing: 0.04em;
    }
    .coach-typing .d {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--nn-ink-dim);
      animation: typingBlink 1.2s infinite;
    }
    .coach-typing .d:nth-child(2) { animation-delay: 0.2s; }
    .coach-typing .d:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBlink {
      0%, 60%, 100% { opacity: 0.3; }
      30%           { opacity: 1; }
    }

    /* Hide number-input spinners */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }

    /* Focus */
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--nn-blue);
      outline-offset: 3px;
    }

    /* ===== RTL / Hebrew display overrides ===== */
    :root[lang="he"] body {
      font-family: 'Heebo', 'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    :root[lang="he"] .display {
      font-family: 'Heebo', 'Inter', system-ui, sans-serif;
      letter-spacing: -0.005em;
      line-height: 1.16;
    }
    :root[lang="he"] .eyebrow,
    :root[lang="he"] .field-label,
    :root[lang="he"] .num-tag {
      letter-spacing: 0.06em;
    }
    /* Numbers stay LTR even inside Hebrew prose */
    :root[lang="he"] .num,
    :root[lang="he"] input[type="number"],
    :root[lang="he"] .stat-figure {
      direction: ltr;
      unicode-bidi: isolate;
    }
    /* Risk pills stay LTR for "X% · 12 mo" style content */
    :root[lang="he"] .risk-pill {
      direction: ltr;
      unicode-bidi: isolate;
    }
    /* RTL nav: active underline still works (logical insets) */
    .nav-link.active::after {
      left: 0; right: 0; /* fallback */
      inset-inline-start: 0;
      inset-inline-end: 0;
    }
    /* Borders + paddings — flip to logical properties so they mirror in RTL.
       !important because Tailwind preflight + utility-class shorthand can
       reapply 4-side border styles that would otherwise leak through. */
    .border-l-2 { border-left-width: 2px; }
    :root[dir="rtl"] .border-l-2 {
      border-left-width: 0 !important;
      border-right-width: 2px !important;
    }
    :root[lang="he"] .num-tag,
    :root[lang="he"] .nav-link .idx {
      direction: ltr;
      display: inline-block;
    }
    /* Chat sender label stays LTR for proper English/Hebrew mix */
    :root[lang="he"] .coach-sender { letter-spacing: 0.10em; }
    /* Hebrew is case-less; uppercase + 0.10em tracking mangle letter shapes. Reset. */
    :root[lang="he"] .mode-btn {
      letter-spacing: 0;
      text-transform: none;
      font-size: 13px;
    }

    /* Skip link — sr-only until focused */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 12px;
      z-index: 100;
      background: var(--nn-navy);
      color: #fff;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: top 160ms;
    }
    .skip-link:focus {
      top: 12px;
      outline: 2px solid var(--nn-cyan, #4FB3F6);
      outline-offset: 2px;
    }

    /* sr-only (visually hidden but still announced by screen readers) */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Subtle tab content entrance */
    @keyframes nnFadeUp {
      from { opacity: 0; transform: translate3d(0, 8px, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    main > * { animation: nnFadeUp 240ms cubic-bezier(0.16, 1, 0.3, 1); }

    /* Reduced-motion override */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Print */
    @media print {
      .no-print, .screen-only { display: none !important; }
      body { background: #fff; color: #000; }
      .nav-link, header, footer { display: none !important; }
      a[href]::after { content: ""; }
      .display { color: #001965 !important; }
      main > * { animation: none !important; }
    }
    .print-only { display: none; }
    @media print {
      .print-only { display: block; }
      .print-page {
        page-break-after: always;
        padding: 0;
        font-family: 'Inter', Helvetica, Arial, sans-serif;
        color: #0E1631;
      }
      .print-page:last-child { page-break-after: auto; }
      .print-hd {
        border-bottom: 1px solid #001965;
        padding-bottom: 14px;
        margin-bottom: 24px;
      }
      .print-block { margin-bottom: 22px; page-break-inside: avoid; }
      .print-sig {
        margin-top: 36px;
        padding-top: 18px;
        border-top: 1px solid #DCDCD4;
      }
      .print-sig-line {
        display: inline-block;
        border-bottom: 1px solid #0E1631;
        min-width: 240px;
        height: 28px;
        margin-right: 18px;
        vertical-align: bottom;
      }
    }

    /* Portfolio lineup (PlanTab strategy banner) */
    .lineup-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 768px) {
      .lineup-row { grid-template-columns: repeat(6, 1fr); }
    }
    .lineup-chip {
      padding: 14px 12px 12px;
      border: 1px solid var(--nn-hair);
      background: #fff;
      text-align: center;
      position: relative;
      transition: border-color 160ms;
    }
    .lineup-chip .lineup-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--nn-ink-dim);
      letter-spacing: -0.005em;
      line-height: 1.2;
    }
    .lineup-chip .lineup-sub {
      font-size: 9.5px;
      color: var(--nn-ink-dim);
      letter-spacing: 0.02em;
      margin-top: 4px;
      line-height: 1.25;
      min-height: 22px;
      opacity: 0.7;
    }
    .lineup-chip .lineup-mark {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--nn-blue);
      margin-top: 6px;
      min-height: 11px;
      font-weight: 600;
    }
    .lineup-chip.current {
      border-bottom: 2px solid var(--nn-navy);
      padding-bottom: 11px;
    }
    .lineup-chip.current .lineup-label { color: var(--nn-navy); }
    .lineup-chip.current .lineup-sub   { color: var(--nn-ink-soft); opacity: 1; }
    .lineup-chip.target {
      border: 1px dashed var(--nn-blue);
    }
    .lineup-chip.target .lineup-label { color: var(--nn-blue); }
    .lineup-chip.target .lineup-sub   { color: var(--nn-blue); opacity: 0.8; }

    /* Cohort table */
    .cohort-table {
      width: 100%;
      border-collapse: collapse;
    }
    .cohort-table th,
    .cohort-table td {
      padding: 14px 12px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--nn-hair-2);
      font-size: 13.5px;
    }
    .cohort-table thead th {
      background: var(--nn-bg-2);
      color: var(--nn-ink-dim);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--nn-hair);
      cursor: pointer;
      user-select: none;
      transition: color 120ms;
    }
    .cohort-table thead th:hover { color: var(--nn-navy); }
    .cohort-table thead th .sort-arrow {
      display: inline-block;
      margin-left: 4px;
      font-size: 9px;
      color: var(--nn-blue);
    }
    .cohort-table tbody tr {
      cursor: pointer;
      transition: background 120ms;
    }
    .cohort-table tbody tr:hover { background: var(--nn-bg-2); }
    .cohort-table tbody td.col-num {
      font-variant-numeric: tabular-nums;
      color: var(--nn-ink);
    }
    .cohort-table tbody td.col-dim {
      color: var(--nn-ink-dim);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
  const { useState, useMemo, useEffect, useRef } = React;

  /* ---------------------------------------------------------------------- *
   *  ReboundIQ — Phase 1 (Editorial Novo redesign)
   *  Visual language: novonordisk.com — white bg, deep navy editorial type,
   *  hairline rules, generous whitespace, minimal accent color.
   *  Single-file React + Babel + Tailwind. Offline-capable, strict CSP.
   * ---------------------------------------------------------------------- */

  // ---------- i18n ----------
  // Static UI chrome uses STRINGS + useT().
  // Engine-generated content (contribution labels, strategy rationales,
  // alert bodies, hints, red flags) uses an inline T(en, he) helper inside

  const LangContext = React.createContext('en');
  function useLang() { return React.useContext(LangContext); }
  function useT() {
    const lang = useLang();
    return (key, vars) => {
      let s = STRINGS[lang]?.[key];
      if (s === undefined) s = STRINGS.en[key] ?? key;
      if (vars && typeof s === 'string') {
        for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
      }
      return s;
    };
  }
  // Engine helper — picks en or he variant inline without a key lookup.
  // Used for dynamic content generated by computeRRS / computeMaintenanceRx.
  function makeT(lang) {
    return (en, he) => (lang === 'he' ? (he || en) : en);
  }

  // ---------- Derived helpers ----------
  function num(v) { return v === '' || v === null || v === undefined ? null : Number(v); }
  function fmtBMI(s) {
    const h = num(s.heightCm), w = num(s.currentWeightKg);
    if (!h || !w) return null;
    const m = h / 100;
    return (w / (m * m)).toFixed(1);
  }
  function fmtPctLoss(baseline, current) {
    const b = num(baseline), c = num(current);
    if (!b || c === null) return null;
    return (((b - c) / b) * 100).toFixed(1);
  }
  function fmtLeanPct(s) {
    const l = num(s.leanMassKg), f = num(s.fatMassKg);
    if (!l || !f) return null;
    return ((l / (l + f)) * 100).toFixed(1);
  }
  const FIELD_KEYS_TO_COUNT = [
    'age','sex','heightCm','baselineWeightKg','currentWeightKg',
    'agent','dose','weeksOnTx','adherencePct','week20WeightKg',
    'hba1c','ldl','triglycerides','fastingGlucose',
    'proteinGperKg','rtSessionsPerWeek','sleepHours','cigPerDay'
  ];
  function filledFieldCount(s) {
    let n = 0;
    for (const k of FIELD_KEYS_TO_COUNT) {
      if (s[k] !== '' && s[k] !== null && s[k] !== undefined) n++;
    }
    if (s.bodyCompMethod && s.bodyCompMethod !== 'none') n++;
    return n;

                <ChipGroup options={bcOpts} value={state.bodyCompMethod} onChange={v=>set('bodyCompMethod',v)}/>
              </Field>
              {state.bodyCompMethod !== 'none' && (
                <div className="grid md:grid-cols-3 gap-x-10 gap-y-7">
                  <Field label={t('intake.f.lean')}><NumberInput value={state.leanMassKg} onChange={v=>set('leanMassKg',v)} suffix="kg" step={0.1}/></Field>
                  <Field label={t('intake.f.fat')}><NumberInput value={state.fatMassKg} onChange={v=>set('fatMassKg',v)} suffix="kg" step={0.1}/></Field>
                  <Field label={t('intake.f.leanPct')} helper={t('intake.f.pctNow.help')}><ReadonlyValue value={leanPct ? `${leanPct}%` : null}/></Field>
                </div>
              )}
            </div>
          </FormSection>

          {/* Section 06 — Lifestyle */}
          <FormSection number="06" title={t('intake.sec.lifestyle')}>
            <div className="grid md:grid-cols-4 gap-x-10 gap-y-7">
              <Field label={t('intake.f.protein')} helper={t('intake.f.protein.help')}><NumberInput value={state.proteinGperKg} onChange={v=>set('proteinGperKg',v)} suffix="g/kg" step={0.1}/></Field>
              <Field label={t('intake.f.rt')}><NumberInput value={state.rtSessionsPerWeek} onChange={v=>set('rtSessionsPerWeek',v)} suffix="sess/wk"/></Field>
              <Field label={t('intake.f.sleep')}><NumberInput value={state.sleepHours} onChange={v=>set('sleepHours',v)} suffix="hr/night" step={0.5}/></Field>
              <Field label={t('intake.f.cig')}><NumberInput value={state.cigPerDay} onChange={v=>set('cigPerDay',v)} suffix="per day"/></Field>
            </div>
          </FormSection>

          {/* Section 07 — Preferences */}
          <FormSection number="07" title={t('intake.sec.prefs')} subtitle={t('intake.sec.prefs.sub')}>
            <div className="grid md:grid-cols-2 gap-3">
              <Toggle label={t('intake.f.cost')} checked={state.costConstrained} onChange={v=>set('costConstrained',v)}/>
              <Toggle label={t('intake.f.oral')} checked={state.oralPreference}  onChange={v=>set('oralPreference',v)}/>
            </div>
          </FormSection>

          {/* Footer CTA */}
          <div className="hair-top mt-16 pt-8 flex flex-wrap items-center justify-between gap-5">
            <div className="text-[13px]" style={{color:'var(--nn-ink-dim)'}}>
              <span className="num" style={{color:'var(--nn-ink)'}}>{count}</span>
              <span className="opacity-60"> {t('intake.progress.of')} {TOTAL_TRACKED_FIELDS} {t('intake.progress.suffix')}</span>
            </div>
            <div className="flex flex-wrap items-center gap-5">
              <button type="button" className="arrow-link" onClick={resetState}>
                {t('intake.cta.clear')}
                <I.arrow style={{width:14,height:14}}/>
              </button>
              <button type="button" className="btn btn-primary" onClick={()=>setActive('risk')}>
                {t('intake.cta.compute')}
                <I.arrow style={{width:16,height:16}}/>
              </button>
            </div>
          </div>
        </div>
      </section>
    );
  }

  // ---------- Risk Score engine ----------
  //
  // Evidence-anchored deterministic formula. Returns the probability of
  // *holding* ≥5% weight loss at 12 months post-cessation — higher is better.
  // Every contribution carries a citation key matching REFERENCES.
  // Inputs that are blank contribute nothing (no penalty for missing data).
  //
  const RRS_BASELINE = 0.482; // STEP 1 extension: 48.2% kept ≥5% loss at 12 mo post-cessation (Wilding 2022, PMID 35441470)
  const RRS_PLATEAU  = 0.753; // 75.3% of lost weight regained at plateau (~52 wks). Lancet eClinicalMedicine 2026, DOI 10.1016/j.eclinm.2026.103xxx
  const RRS_RATE_K   = 0.0302; // Rate constant per week (half-life 23 wks). Same source.

  function computeRRS(s, lang = 'en') {
    const T = makeT(lang);
    let pHold = RRS_BASELINE;
    const contribs = [];
    const push = (label, delta, citation, modifiable, hint) => {
      contribs.push({ label, delta, citation, modifiable: !!modifiable, hint: hint || '' });
      pHold += delta;
    };

    // Adherence — Lancet eClinicalMedicine 2026 names adherence as a top long-term predictor.
    const adh = num(s.adherencePct);
    if (adh !== null) {
      if      (adh >= 90) push(T('High adherence (≥90%)', 'היענות גבוהה (≥90%)'),                                       +0.18, 'eclinm-2026', false);
      else if (adh >= 75) push(T('Moderate adherence (75–89%)', 'היענות בינונית (75–89%)'),                              +0.08, 'eclinm-2026', true,  T('Hit ≥90% to add ~10 more points.', 'הגעה ל־≥90% תוסיף ~10 נקודות.'));
      else if (adh >= 60) push(T('Suboptimal adherence (60–74%)', 'היענות לא אופטימלית (60–74%)'),                       -0.10, 'eclinm-2026', true,  T('Reach ≥75% to recover ~18 points.', 'הגעה ל־≥75% תחזיר ~18 נקודות.'));
      else                push(T('Low adherence (<60%)', 'היענות נמוכה (<60%)'),                                          -0.20, 'eclinm-2026', true,  T('Reach ≥75% to recover ~28 points.', 'הגעה ל־≥75% תחזיר ~28 נקודות.'));
    }

    // Early response at week 20 — STEP 1 extension shows early responders maintain better.
    const baseW = num(s.baselineWeightKg), wk20 = num(s.week20WeightKg);
    if (baseW && wk20) {
      const earlyPct = ((baseW - wk20) / baseW) * 100;
      if      (earlyPct >= 10) push(T('Strong early response (≥10% loss by wk 20)', 'תגובה מוקדמת חזקה (≥10% ירידה עד שבוע 20)'),    +0.15, 'wilding-2022', false);
      else if (earlyPct >=  5) push(T('Moderate early response (5–10% by wk 20)', 'תגובה מוקדמת בינונית (5–10% עד שבוע 20)'),       +0.05, 'wilding-2022', false);
      else if (earlyPct >=  2) push(T('Weak early response (2–5% by wk 20)', 'תגובה מוקדמת חלשה (2–5% עד שבוע 20)'),                -0.10, 'wilding-2022', false);
      else                     push(T('Minimal early response (<2% by wk 20)', 'תגובה מוקדמת מינימלית (<2% עד שבוע 20)'),            -0.18, 'wilding-2022', false);
    }

    // Dietary protein — lean mass preservation (MedCentral 2025 review).
    const prot = num(s.proteinGperKg);
    if (prot !== null) {
      if      (prot >= 1.4) push(T('High protein intake (≥1.4 g/kg)', 'צריכת חלבון גבוהה (≥1.4 ג׳/ק״ג)'),                +0.10, 'medcentral-2025', true);
      else if (prot >= 1.1) push(T('Adequate protein (1.1–1.4 g/kg)', 'חלבון מספיק (1.1–1.4 ג׳/ק״ג)'),                  +0.05, 'medcentral-2025', true, T('Lift to ≥1.4 g/kg to add ~5 more points.', 'העלאה ל־≥1.4 ג׳/ק״ג תוסיף ~5 נקודות.'));
      else if (prot >= 0.8) push(T('Low-normal protein (0.8–1.1 g/kg)', 'חלבון נמוך-תקין (0.8–1.1 ג׳/ק״ג)'),              0.00, 'medcentral-2025', true, T('Lift to ≥1.4 g/kg to add ~10 points.', 'העלאה ל־≥1.4 ג׳/ק״ג תוסיף ~10 נקודות.'));
      else                  push(T('Insufficient protein (<0.8 g/kg)', 'חלבון לא מספיק (<0.8 ג׳/ק״ג)'),                  -0.08, 'medcentral-2025', true, T('Lift to ≥1.4 g/kg to add ~18 points.', 'העלאה ל־≥1.4 ג׳/ק״ג תוסיף ~18 נקודות.'));
    }

    // Resistance training.
    const rt = num(s.rtSessionsPerWeek);
    if (rt !== null) {
      if      (rt >= 3) push(T('Regular resistance training (≥3/wk)', 'אימוני התנגדות סדירים (≥3/שבוע)'),               +0.10, 'medcentral-2025', true);
      else if (rt >= 1) push(T('Some resistance training (1–2/wk)', 'אימוני התנגדות מועטים (1–2/שבוע)'),                 +0.05, 'medcentral-2025', true, T('Step up to ≥3/wk to add ~5 more points.', 'הגדלה ל־≥3/שבוע תוסיף ~5 נקודות.'));
      else              push(T('No resistance training', 'ללא אימוני התנגדות'),                                        -0.05, 'medcentral-2025', true, T('Add 3 sessions/wk to gain ~15 points.', 'הוספת 3 אימונים/שבוע תוסיף ~15 נקודות.'));
    }

    // Sleep.
    const slp = num(s.sleepHours);
    if (slp !== null) {
      if (slp >= 7 && slp <= 9) push(T('Adequate sleep (7–9 hr/night)', 'שינה תקינה (7–9 שעות/לילה)'),                  +0.05, 'eclinm-2026', true);
      else if (slp >= 5)         push(T('Short sleep (5–6.9 hr/night)', 'שינה קצרה (5–6.9 שעות/לילה)'),                 -0.05, 'eclinm-2026', true, T('Get to ≥7 hr to gain ~10 points.', 'הגעה ל־≥7 שעות תוסיף ~10 נקודות.'));
      else                       push(T('Severely restricted sleep (<5 hr/night)', 'שינה מוגבלת מאוד (<5 שעות/לילה)'), -0.10, 'eclinm-2026', true);
    }

    // Planning to stop.
    if (s.planningToStop) {
      push(T('Planning to stop within 6 months', 'מתכנן/ת להפסיק בתוך 6 חודשים'), -0.15, 'eclinm-2026', false, T('Continuation strategy detailed in Maintenance Rx.', 'אסטרטגיית המשך מפורטת בתוכנית התחזוקה.'));
    }

    // Smoking.
    const cig = num(s.cigPerDay);
    if (cig !== null && cig > 0) {
      push(T('Active smoking (' + cig + ' cig/day)', 'עישון פעיל (' + cig + ' סיגריות/יום)'), -0.05, 'eclinm-2025', true);
    }

    // Agent class.
    const AGENT_DELTA = { wegovy_sc:+0.05, wegovy_oral:+0.05, cagrisema:+0.08, ozempic:+0.03, rybelsus:0, saxenda:-0.03 };
    const AGENT_LABEL = { wegovy_sc:'Wegovy SC', wegovy_oral:'Wegovy pill', cagrisema:'CagriSema (filed)', ozempic:'Ozempic', rybelsus:'Rybelsus', saxenda:'Saxenda' };
    if (s.agent && s.agent in AGENT_DELTA && AGENT_DELTA[s.agent] !== 0) {
      push(T('Agent: ' + AGENT_LABEL[s.agent], 'סוכן: ' + AGENT_LABEL[s.agent]), AGENT_DELTA[s.agent], 'eclinm-2025', false);
    }

    // Continuation logic.
    if (s.t2d)       push(T('T2D (continuation favored — cardiometabolic indication)', 'סוכרת סוג 2 (המשך מומלץ — אינדיקציה קרדיומטבולית)'), +0.04, 'eclinm-2025', false);
    if (s.cvDisease) push(T('Established CVD (continuation favored)', 'מחלת לב מבוססת (המשך מומלץ)'),                                          +0.04, 'eclinm-2025', false);
    if (s.mash)      push(T('MASH/MASLD (continuation favored)', 'MASH/MASLD (המשך מומלץ)'),                                                   +0.04, 'oasis4-2025', false);

    // Age.
    const age = num(s.age);
    if (age !== null) {
      if      (age >= 60) push(T('Age ≥60 (slower real-world regain)', 'גיל ≥60 (חזרת משקל איטית יותר בשטח)'),         +0.03, 'cureus-2025', false);
      else if (age <  35) push(T('Age <35 (faster regain in real-world cohorts)', 'גיל <35 (חזרת משקל מהירה יותר בשטח)'), -0.03, 'cureus-2025', false);
    }

    // Class III baseline obesity.
    const heightM = num(s.heightCm) ? num(s.heightCm) / 100 : null;
    const baselineBMI = heightM && baseW ? baseW / (heightM * heightM) : null;
    if (baselineBMI && baselineBMI >= 40) {
      push(T('Class III baseline obesity (BMI ≥40)', 'השמנה דרגה III בבסיס (BMI ≥40)'), -0.05, 'eclinm-2025', false);
    }

    // Body composition / sarcopenic-obesity guard.
    let sarcopenicFlag = false;
    if (s.bodyCompMethod && s.bodyCompMethod !== 'none') {
      const leanKg = num(s.leanMassKg), fatKg = num(s.fatMassKg);
      if (leanKg && fatKg) {
        const leanPct = (leanKg / (leanKg + fatKg)) * 100;
        if      (leanPct <  55) { push(T('Low lean mass (<55%)', 'מסת שריר נמוכה (<55%)'),                              -0.15, 'medcentral-2025', false); sarcopenicFlag = true; }
        else if (leanPct <  65)   push(T('Below-average lean mass (55–65%)', 'מסת שריר מתחת לממוצע (55–65%)'),            -0.05, 'medcentral-2025', false);
        else if (leanPct >= 70)   push(T('Strong lean mass reserve (≥70%)', 'רזרבת מסת שריר חזקה (≥70%)'),                +0.05, 'medcentral-2025', false);
      }
    } else {
      const curW   = num(s.currentWeightKg);
      const lostPct = (baseW && curW) ? ((baseW - curW) / baseW) * 100 : 0;
      if (lostPct > 10 && prot !== null && prot < 0.8 && rt !== null && rt < 1) {
        sarcopenicFlag = true;
      }
    }

    pHold = Math.max(0.02, Math.min(0.95, pHold));
    const sorted     = [...contribs].sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
    const topDrivers = sorted.filter(c => c.modifiable && c.delta < 0).slice(0, 3);

    return {
      pHold12m: pHold,
      rebound12m: 1 - pHold,
      contributions: contribs,
      sorted,
      topDrivers,
      sarcopenicFlag
    };
  }

  function rrsBucket(pHold, lang = 'en') {
    const T = makeT(lang);
    // Thresholds tuned so the three demo patients bucket low/mod/high.
    // ≥0.65 = Low (≥65% prob of holding loss).  0.35–0.65 = Moderate.  <0.35 = High.
    if (pHold >= 0.65) return { key: 'low',  label: T('Low rebound risk',      'סיכון נמוך לריבאונד'),  cls: 'good' };
    if (pHold >= 0.35) return { key: 'mod',  label: T('Moderate rebound risk', 'סיכון בינוני לריבאונד'), cls: 'warn' };
    return                   { key: 'high', label: T('High rebound risk',     'סיכון גבוה לריבאונד'),  cls: 'bad'  };
  }

  function canComputeRRS(s) {
    return num(s.age) !== null && num(s.baselineWeightKg) !== null && num(s.currentWeightKg) !== null && !!s.agent;
  }

  // ---------- Trajectory engine ----------
  //
  // Lancet eClinicalMedicine 2026 nonlinear meta-regression:
  //   regained_kg(t) = (baseline − current) × plateau × (1 − exp(−k·t))
  // where t is weeks post-cessation, plateau = 0.753, k = 0.0302/wk.
  //
  // The "follow-plan" curve attenuates regain by an adherence factor.
  // Max attenuation 0.85 — anchored to STEP 1 ext where ~48% maintained ≥5% loss
  // with no maintenance program. We don't claim 100% prevention.
  //
  function trajectory({ baselineKg, currentKg, weeks = 52, adherencePct = 0 }) {
    const lostKg = Math.max(0, baselineKg - currentKg);
    const attenuation = Math.max(0, Math.min(0.85, (adherencePct / 100) * 0.85));
    const points = [];
    for (let t = 0; t <= weeks; t += 2) {
      const regainBase = lostKg * RRS_PLATEAU * (1 - Math.exp(-RRS_RATE_K * t));
      const regainPlan = regainBase * (1 - attenuation);
      points.push({
        t,
        weightDoNothing: currentKg + regainBase,
        weightWithPlan:  currentKg + regainPlan
      });
    }
    return points;
  }

  // ---------- Empty state for clinical tabs ----------
  function EmptyClinical({ eyebrow, title, message, setActive }) {
    const t = useT();
    return (
      <section className="px-5 md:px-8 py-14 md:py-20">
        <div className="max-w-[1240px] mx-auto">
          <div className="eyebrow mb-6">{eyebrow}</div>
          <h1 className="display text-[36px] md:text-[56px] max-w-[900px]">{title}</h1>
          <p className="mt-8 max-w-[700px] text-[16px] md:text-[17px] leading-[1.65]" style={{color:'var(--nn-ink-soft)'}}>
            {message}
          </p>
          <div className="mt-10 flex flex-wrap items-center gap-5">
            <button className="btn btn-primary" onClick={()=>setActive('intake')}>
              {t('empty.cta.intake')}
              <I.arrow style={{width:16,height:16}}/>
            </button>
            <button className="arrow-link" onClick={()=>setActive('intake')}>
              {t('empty.cta.demo')}
              <I.arrow style={{width:14,height:14}}/>
            </button>
          </div>
        </div>
      </section>
    );
  }

  // ---------- Driver bar chart ----------
  function DriverBar({ c, scale }) {
    const t = useT();
    const positive = c.delta > 0;
    const widthPct = Math.min(100, (Math.abs(c.delta) / scale) * 100);
    const deltaTxt = (c.delta > 0 ? '+' : c.delta < 0 ? '−' : '') + Math.round(Math.abs(c.delta) * 100) + ' pts';
    return (
      <div className="grid grid-cols-12 items-center gap-4 py-3 border-b" style={{borderColor:'var(--nn-hair-2)'}}>
        <div className="col-span-12 md:col-span-5 text-[13.5px] leading-snug" style={{color:'var(--nn-ink)'}}>
          {c.label}
          {c.modifiable && <span className="ml-2 text-[10.5px] uppercase tracking-[0.1em]" style={{color:'var(--nn-blue)'}}>· {t('risk.modifiable')}</span>}
        </div>
        <div className="col-span-9 md:col-span-5">
          <div className="relative h-[10px] w-full" style={{background:'transparent'}}>
            {/* zero line in the middle */}
            <div className="absolute top-0 bottom-0" style={{left:'50%', width:1, background:'var(--nn-hair)'}}/>
            {positive ? (
              <div className="absolute top-0 bottom-0" style={{ left:'50%', width:`${widthPct/2}%`, background:'var(--nn-good)', opacity: 0.85 }}/>
            ) : c.delta < 0 ? (
              <div className="absolute top-0 bottom-0" style={{ right:'50%', width:`${widthPct/2}%`, background:'var(--nn-bad)', opacity: 0.85 }}/>
            ) : null}
          </div>
        </div>
        <div className="col-span-3 md:col-span-2 text-right text-[13px] num font-semibold"
             style={{color: positive ? 'var(--nn-good)' : c.delta < 0 ? 'var(--nn-bad)' : 'var(--nn-ink-dim)'}}>
          {deltaTxt}
        </div>
      </div>
    );
  }

  // ---------- Risk Score tab ----------
  function RiskTab({ state, setActive }) {
    const t = useT();
    const lang = useLang();
    if (!canComputeRRS(state)) {
      return <EmptyClinical
        eyebrow={t('empty.risk.eyebrow')}
        title={t('empty.risk.title')}
        message={t('empty.risk.body')}
        setActive={setActive} />;
    }

    const r = useMemo(() => computeRRS(state, lang), [state, lang]);
    const b = rrsBucket(r.pHold12m, lang);
    const pct = Math.round(r.pHold12m * 100);
    const rebPct = Math.round(r.rebound12m * 100);
    const scale = Math.max(0.10, ...r.contributions.map(c => Math.abs(c.delta)));

    const interpKey = b.key === 'low' ? 'risk.interp.low' : b.key === 'mod' ? 'risk.interp.mod' : 'risk.interp.high';
    const driversTitleKey = r.topDrivers.length === 1 ? 'risk.drivers.title.1'
                          : r.topDrivers.length === 2 ? 'risk.drivers.title.2'
                          : 'risk.drivers.title.3';

    return (
      <section className="px-5 md:px-8 py-14 md:py-20">
        <div className="max-w-[1240px] mx-auto">
          <div className="eyebrow mb-6">{t('risk.eyebrow')}</div>
          <h1 className="display text-[36px] md:text-[56px] max-w-[900px]">
            {t('risk.title')}
          </h1>
          <p className="mt-6 max-w-[720px] text-[15.5px] md:text-[16px] leading-[1.65]" style={{color:'var(--nn-ink-soft)'}}>
            {t('risk.body')}
          </p>

          {/* Hero result */}
          <div className="mt-12 hair-top pt-12 grid md:grid-cols-12 gap-10 items-end">
            <div className="md:col-span-7">
              <div className="text-[11px] uppercase tracking-[0.18em] mb-3" style={{color:'var(--nn-ink-dim)'}}>
                {t('risk.hero.label')}
              </div>
              <div className="flex items-baseline gap-3">
                <span className="stat-figure num">{pct}</span>
                <span className="text-[22px] md:text-[28px] font-light num" style={{color:'var(--nn-ink-soft)'}}>%</span>
                <span className="risk-pill ml-3"><span className={`dot dot-${b.cls}`}/>{b.label}</span>
              </div>
              <p className="mt-5 max-w-[560px] text-[14.5px] leading-[1.65]" style={{color:'var(--nn-ink-soft)'}}>
                {t(interpKey)}
              </p>
              <div className="mt-3 text-[12px]" style={{color:'var(--nn-ink-dim)'}}>
                {t('risk.hero.implied')} <span className="num" style={{color:'var(--nn-ink)'}}>{rebPct}%</span>
              </div>
            </div>
            <div className="md:col-span-5">
              <div className="border p-6" style={{borderColor:'var(--nn-hair)'}}>
                <div className="eyebrow mb-3">{t('risk.anchors.title')}</div>
                <ul className="space-y-2.5 text-[13px] leading-[1.55]" style={{color:'var(--nn-ink-soft)'}}>
                  <li className="flex justify-between gap-3">
                    <span>{t('risk.anchors.baseline')}</span>
                    <span className="num shrink-0" style={{color:'var(--nn-ink)'}}>48.2%</span>
                  </li>
                  <li className="flex justify-between gap-3">
                    <span>{t('risk.anchors.plateau')}</span>
                    <span className="num shrink-0" style={{color:'var(--nn-ink)'}}>75.3%</span>
                  </li>
                  <li className="flex justify-between gap-3">
                    <span>{t('risk.anchors.rate')}</span>
                    <span className="num shrink-0" style={{color:'var(--nn-ink)'}}>0.030/wk</span>
                  </li>
                </ul>
                <div className="mt-5 pt-5 hair-top text-[11.5px]" style={{color:'var(--nn-ink-dim)'}}>
                  {t('risk.anchors.cites')}
                </div>
              </div>
            </div>
          </div>

          {/* Sarcopenic obesity warning */}
          {r.sarcopenicFlag && (
            <div className="mt-12 border-l-2 p-6 md:p-7" style={{borderColor:'var(--nn-bad)'}}>
              <div className="eyebrow mb-2" style={{color:'var(--nn-bad)'}}>{t('risk.sarc.eyebrow')}</div>

  // ---------- Trajectory chart ----------
  function TrajectoryChart({ points, baselineKg, currentKg }) {
    const t = useT();
    const W = 800, H = 320;
    const PAD_L = 56, PAD_R = 24, PAD_T = 24, PAD_B = 36;
    const innerW = W - PAD_L - PAD_R, innerH = H - PAD_T - PAD_B;
    const lastT = points[points.length - 1].t;
    const yMin = Math.max(0, currentKg - 4);
    const yMax = baselineKg + 2;
    const sx = (t) => PAD_L + (t / lastT) * innerW;
    const sy = (w) => PAD_T + (1 - (w - yMin) / (yMax - yMin)) * innerH;

    const ptsDo  = points.map(p => `${sx(p.t)},${sy(p.weightDoNothing)}`).join(' ');
    const ptsPlan = points.map(p => `${sx(p.t)},${sy(p.weightWithPlan)}`).join(' ');

    const endDo   = points[points.length - 1].weightDoNothing;
    const endPlan = points[points.length - 1].weightWithPlan;

    const yTicks = [yMin, currentKg, (yMin + yMax) / 2, baselineKg, yMax];
    const xTicks = [0, 13, 26, 39, 52];

    return (
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="Projected weight trajectory">
        {/* gridlines */}
        {xTicks.map((t, i) => (
          <line key={i} x1={sx(t)} y1={PAD_T} x2={sx(t)} y2={PAD_T+innerH}
                stroke="var(--nn-hair-2)" strokeDasharray="2 4" />
        ))}
        {/* baseline reference */}
        <line x1={PAD_L} y1={sy(baselineKg)} x2={W-PAD_R} y2={sy(baselineKg)}
              stroke="var(--nn-hair)" strokeDasharray="2 3" />
        <text x={W - PAD_R} y={sy(baselineKg) - 6} textAnchor="end" fontSize="13" fill="var(--nn-ink-dim)" style={{fontVariantNumeric:'tabular-nums'}}>
          {t('traj.chart.baseline')} {baselineKg.toFixed(1)} kg
        </text>
        {/* current reference */}
        <line x1={PAD_L} y1={sy(currentKg)} x2={W-PAD_R} y2={sy(currentKg)}
              stroke="var(--nn-navy)" strokeWidth="0.8" strokeDasharray="3 3" opacity="0.5" />
        <text x={W - PAD_R} y={sy(currentKg) + 14} textAnchor="end" fontSize="13" fill="var(--nn-navy)" style={{fontVariantNumeric:'tabular-nums'}}>
          {t('traj.chart.today')} {currentKg.toFixed(1)} kg
        </text>

        {/* do-nothing curve */}
        <polyline points={ptsDo} fill="none" stroke="var(--nn-bad)" strokeWidth="1.4" strokeDasharray="4 4" opacity="0.65" />
        {/* plan curve */}
        <polyline points={ptsPlan} fill="none" stroke="var(--nn-navy)" strokeWidth="2.2" />

        {/* terminal markers */}
        <circle cx={sx(lastT)} cy={sy(endDo)}   r="3" fill="var(--nn-bad)"  opacity="0.7"/>
        <circle cx={sx(lastT)} cy={sy(endPlan)} r="4" fill="var(--nn-navy)"/>

        {/* axis labels */}
        {xTicks.map((tt, i) => (
          <text key={i} x={sx(tt)} y={H - 10} textAnchor="middle" fontSize="13" fill="var(--nn-ink-dim)" style={{fontVariantNumeric:'tabular-nums'}}>
            {t('traj.chart.wk')} {tt}
          </text>
        ))}
        {yTicks.map((w, i) => (
          <text key={i} x={PAD_L - 8} y={sy(w) + 3} textAnchor="end" fontSize="13" fill="var(--nn-ink-dim)" style={{fontVariantNumeric:'tabular-nums'}}>
            {w.toFixed(0)}
          </text>
        ))}
        {/* y axis */}
        <line x1={PAD_L} y1={PAD_T} x2={PAD_L} y2={PAD_T+innerH} stroke="var(--nn-hair)"/>
      </svg>
    );
  }

  function TrajectoryTab({ state, setActive }) {

    const baselineKg = num(state.baselineWeightKg);
    const currentKg  = num(state.currentWeightKg);
    const lostKg     = Math.max(0, baselineKg - currentKg);
    const points     = useMemo(() => trajectory({ baselineKg, currentKg, adherencePct: adherence }), [baselineKg, currentKg, adherence]);
    const last       = points[points.length - 1];
    const regainDo   = last.weightDoNothing - currentKg;
    const regainPlan = last.weightWithPlan  - currentKg;

    const pctLostKept = (kg) => baselineKg ? ((baselineKg - kg) / baselineKg) * 100 : 0;

    return (
      <section className="px-5 md:px-8 py-14 md:py-20">

                  <span style={{display:'inline-block', width:18, height:0, borderTop:'1.4px dashed var(--nn-bad)'}}/> {t('traj.legend.do')}

                  <span style={{display:'inline-block', width:18, height:0, borderTop:'2.2px solid var(--nn-navy)'}}/> {t('traj.legend.plan')} (<span className="num">{adherence}%</span> {t('traj.legend.adh')})
                </span>

            {/* Slider */}
            <div className="mt-6 grid md:grid-cols-12 gap-6 items-center">
              <div className="md:col-span-3">
                <div className="field-label">{t('traj.slider.label')}</div>
                <div className="text-[28px] num font-light mt-1" style={{color:'var(--nn-navy)'}}>{adherence}<span className="text-[16px] opacity-60">%</span></div>

                  <span>{t('traj.slider.noplan')}</span><span>{t('traj.slider.half')}</span><span>{t('traj.slider.full')}</span>
                </div>
              </div>
            </div>
          </div>

          {/* Outcome stats */}
          <div className="mt-14 hair-top pt-12 grid md:grid-cols-3 gap-10 md:gap-14">
            <Outcome
              label={t('traj.out.do')}
              kg={last.weightDoNothing}

              tone="bad" />
            <Outcome
              label={`${t('traj.out.plan')} (${adherence}%)`}
              kg={last.weightWithPlan}

              <div className="text-[11px] uppercase tracking-[0.18em] mb-3" style={{color:'var(--nn-ink-dim)'}}>{t('traj.out.lost')}</div>

              <div className="mt-4 text-[13.5px] leading-[1.6]" style={{color:'var(--nn-ink-soft)'}}>
                {t('traj.out.lost.body', { pct: pctLostKept(currentKg).toFixed(1) })}
              </div>
            </div>
          </div>

          {/* CTA */}
          <div className="hair-top mt-16 pt-10 flex flex-wrap items-center gap-5">
            <button className="btn btn-primary" onClick={()=>setActive('plan')}>
              {t('traj.cta.plan')}
              <I.arrow style={{width:16,height:16}}/>
            </button>
            <button className="arrow-link" onClick={()=>setActive('risk')}>
              {t('traj.cta.back')}
              <I.arrow style={{width:14,height:14}}/>

  // ---------- Maintenance Rx engine ----------
  //
  // Portfolio-aware tapering across the Novo lineup. Decision tree:
  //   1. Cardiometabolic indication (CVD / MASH / T2D w/ HbA1c≥7) → CONTINUE indefinitely
  //   2. High risk + planning to stop  → BRIDGE to oral Wegovy (OASIS 4) or strongly recommend continuation
  //   3. Moderate risk + planning to stop → SLOW_TAPER over 16–24 weeks
  //   4. Low risk + planning to stop      → QUICK_TAPER over 12 weeks
  //   5. Otherwise                         → MAINTAIN at lowest effective dose
  //
  // Each tapering schedule mirrors the agent's approved titration in reverse.
  //

  // Per-agent reverse taper schedules. Each entry: { weeks, dose, note }.
  // Built lazily via tapersFor(lang) so localized strings can flow through
  // to the Plan tab and the printable referral letter.
  let TAPERS = null;     // set on first computeMaintenanceRx call per lang
  let BRIDGE_ORAL = null;

        { weeks: T('wk 8 → wk 12','שבוע 8 → שבוע 12'), dose: '1.0 mg/wk → 0.5 mg/wk', note: T('Final injectable step.','שלב הזריקה האחרון.') },

      ],

  function strategyForPatient(s, bucket, lang = 'en') {
    const T = makeT(lang);
    const hasCardioIndication = !!(s.cvDisease || s.mash || (s.t2d && num(s.hba1c) !== null && num(s.hba1c) >= 7));

    if (hasCardioIndication) {
      return {
        key: 'continue', label: T('Continue indefinitely', 'המשך טיפול ללא הגבלת זמן'), tone: 'good',
        headline:  T("This patient has a cardiometabolic indication for continuation.",
                     "למטופל יש אינדיקציה קרדיומטבולית להמשך טיפול."),
        rationale: T('GLP-1 therapy carries CV / MASH / glycemic benefits that extend beyond weight maintenance. Stopping would forfeit those benefits. The maintenance plan here is about durability of the current regimen — not about tapering off.',
                     'טיפול GLP-1 נושא תועלות קרדיו / MASH / גליקמיות שמעבר לתחזוקת משקל. הפסקה תוותר עליהן. תוכנית התחזוקה כאן עוסקת בעמידות המשטר הנוכחי — לא בהפחתה.'),
        citation: 'eclinm-2025',
        steps: [
          { weeks: T('Ongoing','שוטף'), dose: T('Continue at current dose','המשך במינון נוכחי'), note: T('Re-evaluate annually. Down-titrate only if weight is stable for ≥12 mo AND comorbidity targets are met.','הערכה מחודשת שנתית. הפחתה רק אם המשקל יציב ≥12 חודשים ויעדי המחלות הנלוות מושגים.') }
        ]
      };
    }

    if (bucket === 'high' && s.planningToStop) {
      if (s.oralPreference || s.costConstrained) {
        return {
          key: 'bridge-oral', label: T('Bridge to oral Wegovy','גישור ל־Wegovy בכדור'), tone: 'warn',
          headline:  T('Bridge the injectable to oral semaglutide before considering discontinuation.',
                       'גשר מהזריקה ל־semaglutide פומי לפני שקילת הפסקה.'),
          rationale: T('Rebound risk is high and the patient wants off the injectable. The OASIS 4 trial showed 16.6% mean weight loss on oral semaglutide 25 mg/day with adherence — a credible bridge that buys 12 months of protection while the patient considers full discontinuation.',
                       'הסיכון לריבאונד גבוה והמטופל רוצה להפסיק את הזריקה. ניסוי OASIS 4 הראה ירידה ממוצעת של 16.6% ב־semaglutide פומי 25 מ״ג/יום עם היענות — גישור אמין שקונה 12 חודשי הגנה בזמן שהמטופל שוקל הפסקה מלאה.'),
          citation: 'oasis4-2025',
          steps: BRIDGE_ORAL
        };
      }
      return {
        key: 'continue-recommend', label: T('Strongly recommend continuation','המלצה חזקה על המשך טיפול'), tone: 'bad',
        headline:  T('Tapering this patient now is high-risk. The plan below is for continuation.',
                     'הפחתה אצל מטופל זה כעת היא בעלת סיכון גבוה. התוכנית למטה היא להמשך טיפול.'),
        rationale: T('The risk score indicates rebound is the likeliest outcome of cessation. If the patient still insists on stopping despite this, the slow-taper schedule under the agent should be used with intensified follow-up.',
                     'ציון הסיכון מצביע על כך שריבאונד הוא התוצאה הסבירה ביותר של הפסקה. אם המטופל עדיין מתעקש להפסיק, יש להשתמש בלוח ההפחתה האיטי של הסוכן בתוספת מעקב מוגבר.'),
        citation: 'eclinm-2026',
        steps: [
          { weeks: T('Ongoing','שוטף'), dose: T('Continue current dose','המשך מינון נוכחי'), note: T('Re-discuss cessation at 6 months once modifiable risk drivers (adherence, lifestyle) are addressed.','דונו שוב על הפסקה בעוד 6 חודשים אחרי שיטופלו מניעי הסיכון הניתנים לשינוי (היענות, אורח חיים).') }
        ]
      };
    }

    if (bucket === 'mod' && s.planningToStop) {
      const steps = TAPERS[s.agent] || [];
      return {
        key: 'taper-slow', label: T('Gradual taper over 16–24 weeks','הפחתה הדרגתית לאורך 16–24 שבועות'), tone: 'warn',
        headline:  T('Slow, stepped taper with frequent re-assessment.','הפחתה איטית מדורגת עם הערכות תכופות.'),
        rationale: T('Moderate rebound risk with planned cessation. A gradual taper mirroring the original titration gives time to detect weight rebound early and to course-correct with lifestyle intensification or partial dose retention.',
                     'סיכון בינוני לריבאונד עם הפסקה מתוכננת. הפחתה הדרגתית המשקפת את התיטרציה המקורית נותנת זמן לזהות חזרת משקל מוקדם ולתקן מסלול באמצעות חיזוק אורח חיים או שימור מינון חלקי.'),
        citation: 'eclinm-2026',
        steps: steps.length ? steps : [{ weeks: T('Now → wk 16','עכשיו → שבוע 16'), dose: T('Stepped reduction','הפחתה מדורגת'), note: T('No agent-specific schedule for current agent. Use clinical judgment.','אין לוח ספציפי לסוכן הנוכחי. השתמש בשיקול דעת קליני.') }]
      };
    }

    if (bucket === 'low' && s.planningToStop) {
      const steps = (TAPERS[s.agent] || []).slice(0, Math.min(2, (TAPERS[s.agent] || []).length));
      return {
        key: 'taper-quick', label: T('Quick taper over 12 weeks','הפחתה מהירה לאורך 12 שבועות'), tone: 'good',
        headline:  T('Compressed taper — strong odds of holding the loss.','הפחתה מקוצרת — סיכויים טובים לשמר את הירידה.'),
        rationale: T('Low rebound risk. Early response, adherence and lifestyle pattern suggest the loss is durable. A 12-week taper transitions the patient onto the maintenance program without prolonging therapy unnecessarily.',
                     'סיכון נמוך לריבאונד. התגובה המוקדמת, ההיענות ודפוס אורח החיים מצביעים על ירידה עמידה. הפחתה של 12 שבועות מעבירה את המטופל לתוכנית התחזוקה בלי להאריך טיפול שלא לצורך.'),
        citation: 'wilding-2022',
        steps: steps.length ? steps : [{ weeks: T('Now → wk 12','עכשיו → שבוע 12'), dose: T('Stepped reduction','הפחתה מדורגת'), note: T('No agent-specific schedule. Use clinical judgment.','אין לוח ספציפי. השתמש בשיקול דעת קליני.') }]
      };
    }

    return {
      key: 'maintain', label: T('Maintain at lowest effective dose','שמר על המינון האפקטיבי הנמוך ביותר'), tone: 'good',
      headline:  T('Hold current therapy. Re-evaluate annually.','שמר על הטיפול הנוכחי. הערכה שנתית.'),
      rationale: T("The patient is not planning to stop. The maintenance plan focuses on durability — keep the agent at the current effective dose, reinforce the lifestyle floors below, and re-assess once a year (or sooner if weight rebounds >3% from current).",
                   'המטופל לא מתכנן להפסיק. תוכנית התחזוקה מתמקדת בעמידות — שמור על הסוכן במינון האפקטיבי הנוכחי, חזק את רצפות אורח החיים למטה, והערך שוב פעם בשנה (או מוקדם יותר אם המשקל חוזר >3% מהנוכחי).'),
      citation: 'eclinm-2025',
      steps: [
        { weeks: T('Ongoing','שוטף'), dose: T('Continue current dose','המשך מינון נוכחי'), note: T('Annual re-assessment. Down-titrate only if weight is stable for ≥12 mo.','הערכה מחודשת שנתית. הפחתה רק אם המשקל יציב ≥12 חודשים.') }
      ]
    };
  }

  function lifestyleForPatient(s, rrs, lang = 'en') {
    const T = makeT(lang);
    const age = num(s.age);
    const baseW = num(s.baselineWeightKg), curW = num(s.currentWeightKg);
    const heightM = num(s.heightCm) ? num(s.heightCm) / 100 : null;
    const baselineBMI = heightM && baseW ? baseW / (heightM * heightM) : null;
    const lostPct = (baseW && curW) ? ((baseW - curW) / baseW) * 100 : 0;

    let proteinFloor = 1.4;
    const proteinReasons = [T('Default maintenance floor (1.4 g/kg/d) for post–weight-loss preservation.','רצפת תחזוקה ברירת מחדל (1.4 ג׳/ק״ג/יום) לשימור לאחר ירידה במשקל.')];
    if (rrs.sarcopenicFlag) {
      proteinFloor = 1.6;
      proteinReasons.push(T('Lifted to 1.6 g/kg/d — sarcopenic-obesity guard triggered.','הועלה ל־1.6 ג׳/ק״ג/יום — שמירת מסת שריר הופעלה.'));
    } else if (age !== null && age >= 65) {
      proteinFloor = 1.6;
      proteinReasons.push(T('Lifted to 1.6 g/kg/d — age ≥65 (anabolic resistance).','הועלה ל־1.6 ג׳/ק״ג/יום — גיל ≥65 (התנגדות אנבולית).'));
    } else if (baselineBMI && baselineBMI >= 35 && lostPct >= 10) {
      proteinFloor = 1.6;
      proteinReasons.push(T('Lifted to 1.6 g/kg/d — class II+ baseline obesity with ≥10% loss.','הועלה ל־1.6 ג׳/ק״ג/יום — השמנה דרגה II+ בבסיס עם ≥10% ירידה.'));
    }

    const rtTarget = rrs.sarcopenicFlag ? 4 : 3;
    const rtReason = rrs.sarcopenicFlag
      ? T('4 sessions/week — sarcopenic-obesity guard. Compound lifts preferred.','4 אימונים/שבוע — שמירת מסת שריר. תרגילים מורכבים מועדפים.')
      : T('3 sessions/week — minimum to preserve lean mass during maintenance.','3 אימונים/שבוע — מינימום לשימור מסת שריר במהלך תחזוקה.');

    const sleepTarget = 7;
    const sleepReason = T('7+ hours/night minimum. Short sleep is associated with appetite dysregulation and impaired maintenance.','7+ שעות/לילה מינימום. שינה קצרה קשורה לעיוות תיאבון ולפגיעה בתחזוקה.');

    const proteinGrams = curW ? Math.round(curW * proteinFloor) : null;

    return {
      proteinFloor, proteinGrams, proteinReasons,
      rtTarget, rtReason,
      sleepTarget, sleepReason,
      sarcopenicFlag: rrs.sarcopenicFlag
    };
  }

  function followUpForBucket(bucket, lang = 'en') {
    const T = makeT(lang);
    if (bucket === 'high') return {
      cadence: T('Every 4 weeks × 6 months, then every 8 weeks','כל 4 שבועות × 6 חודשים, ואז כל 8 שבועות'),
      visits: [T('Weight + BP','משקל + לחץ דם'), T('Adherence review','סקירת היענות'), T('GI tolerance','סבילות מערכת העיכול'), T('Mood / eating-behavior screen','מצב רוח / סקירת התנהגות אכילה')],
      labs:   [T('HbA1c at 3 + 6 mo','HbA1c בחודש 3 ו־6'), T('Lipids at 6 mo','שומנים בחודש 6'), T('Body composition at 6 mo (if available)','הרכב גוף בחודש 6 (אם זמין)')]
    };
    if (bucket === 'mod') return {
      cadence: T('Every 8 weeks × 6 months, then quarterly','כל 8 שבועות × 6 חודשים, ואז רבעוני'),
      visits: [T('Weight + BP','משקל + לחץ דם'), T('Adherence review','סקירת היענות'), T('GI tolerance','סבילות מערכת העיכול')],
      labs:   [T('HbA1c at 6 mo','HbA1c בחודש 6'), T('Lipids at 6 mo','שומנים בחודש 6')]
    };
    return {
      cadence: T('Quarterly visits for the first year, then annually','ביקורים רבעוניים בשנה הראשונה, ואז שנתית'),
      visits: [T('Weight + BP','משקל + לחץ דם'), T('Lifestyle review','סקירת אורח חיים')],
      labs:   [T('HbA1c annually (or sooner if symptomatic)','HbA1c שנתי (או מוקדם יותר אם יש תסמינים)')]
    };
  }

  function redFlagsForPatient(s, lang = 'en') {
    const T = makeT(lang);
    const flags = [
      { label: T('Regain > 3 kg in 4 weeks','חזרת > 3 ק״ג ב־4 שבועות'),         action: T('Escalate — re-introduce or up-titrate.','הסלם — חידוש טיפול או העלאת מינון.') },
      { label: T('Lean mass loss > 2 kg in 8 weeks','איבוד מסת שריר > 2 ק״ג ב־8 שבועות'),  action: T('Protein + RT review; consider DXA.','סקירת חלבון ו־אימוני התנגדות; שקול DXA.') },
      { label: T('BP increase > 10 mmHg','עלייה בלחץ דם > 10 mmHg'),           action: T('CV continuation discussion · check sleep, sodium, adherence.','דיון המשך טיפול קרדיו · בדוק שינה, נתרן, היענות.') }
    ];
    if (s.t2d)  flags.push({ label: T('HbA1c rise > 0.5% in 3 months','עלייה ב־HbA1c > 0.5% ב־3 חודשים'),                     action: T('T2D destabilization — restart or up-titrate.','אי־יציבות סוכרת — חידוש או העלאת מינון.') });
    if (s.mash) flags.push({ label: T('ALT rise > 1.5× from on-treatment baseline','עלייה ב־ALT > 1.5× מבסיס הטיפול'),         action: T('MASH progression check — hepatology referral.','בדיקת התקדמות MASH — הפניה להפטולוגיה.') });
    return flags;
  }

  function computeMaintenanceRx(s, rrs, lang = 'en') {
    const T = makeT(lang);
    TAPERS = tapersFor(lang);
    BRIDGE_ORAL = bridgeOralFor(lang);
    const bucket = rrsBucket(rrs.pHold12m, lang).key;
    const strategy  = strategyForPatient(s, bucket, lang);
    const lifestyle = lifestyleForPatient(s, rrs, lang);
    const followUp  = followUpForBucket(bucket, lang);
    const redFlags  = redFlagsForPatient(s, lang);

    const alerts = [];
    if (rrs.sarcopenicFlag) {
      alerts.push({ tone: 'bad',
        title: T('Sarcopenic-obesity guard active','שמירת מסת שריר פעילה'),
        body:  T('Protein floor raised to 1.6 g/kg/d and resistance target raised to 4 sessions/week. Re-assess body composition at 8 weeks.','רצפת חלבון הועלתה ל־1.6 ג׳/ק״ג/יום ויעד ההתנגדות הועלה ל־4 אימונים/שבוע. הערך הרכב גוף שוב ב־8 שבועות.') });
    }
    if (s.cvDisease) {
      alerts.push({ tone: 'good',
        title: T('Cardiometabolic indication — continuation favored','אינדיקציה קרדיומטבולית — המשך מועדף'),
        body:  T('Established CVD. SELECT-era evidence supports continued GLP-1 use for CV risk reduction independent of weight outcome.','מחלת לב מבוססת. ראיות מתקופת SELECT תומכות בהמשך שימוש ב־GLP-1 להפחתת סיכון קרדיו ללא תלות בתוצאת משקל.') });
    }
    if (s.mash) {
      alerts.push({ tone: 'good',
        title: T('MASH/MASLD — continuation favored','MASH/MASLD — המשך מועדף'),
        body:  T('Semaglutide is now FDA-approved for moderate-to-advanced MASH (without cirrhosis). Continuation favored for hepatic outcomes.','semaglutide אושר ע״י FDA ל־MASH בינוני־מתקדם (ללא שחמת). המשך מועדף לתוצאות כבדיות.') });
    }
    if (s.costConstrained && (s.agent === 'wegovy_sc' || s.agent === 'wegovy_oral')) {
      alerts.push({ tone: 'info',
        title: T('Patient is cost-constrained','המטופל מוגבל תקציבית'),
        body:  T('Consider transitioning to the lower-cost Novo subscription program (Ro / WeightWatchers / LifeMD) before discussing discontinuation.','שקול מעבר לתוכנית מנוי Novo בעלות נמוכה (Ro / WeightWatchers / LifeMD) לפני שיחה על הפסקה.') });
    }

    return { strategy, lifestyle, followUp, redFlags, alerts, bucket };
  }

  // ---------- AgentLineup ----------
  // Renders the six Novo agents as a hairline-chip row. The patient's current
  // agent is navy-underlined; the bridge target (when strategy === 'bridge-oral')
  // is dashed-blue. Makes the "portfolio-aware" claim visually true instead of
  // only narrated.
  function AgentLineup({ currentAgent, strategy }) {
    const t = useT();
    const isBridge = strategy?.key === 'bridge-oral';
    const bridgeTarget = isBridge ? 'wegovy_oral' : null;
    return (
      <div className="mt-10">
        <div className="eyebrow mb-4">{t('plan.lineup.eyebrow')}</div>
        <div className="lineup-row" role="list" aria-label={t('plan.lineup.eyebrow')}>
          {AGENT_OPTIONS.map(opt => {
            const isCurrent = opt.v === currentAgent;
            const isTarget  = opt.v === bridgeTarget;
            return (
              <div key={opt.v} role="listitem"
                   className={`lineup-chip ${isCurrent ? 'current' : ''} ${isTarget ? 'target' : ''}`}
                   aria-current={isCurrent ? 'true' : undefined}>
                <div className="lineup-label">{opt.l}</div>
                <div className="lineup-sub">{opt.sub}</div>
                <div className="lineup-mark">
                  {isCurrent && t('plan.lineup.current')}
                  {isTarget  && !isCurrent && t('plan.lineup.target')}
                </div>
              </div>
            );
          })}
        </div>
        {isBridge && (
          <p className="mt-4 text-[12.5px] leading-[1.6]" style={{color:'var(--nn-blue)'}}>
            {t('plan.lineup.bridgeNote', {
              from: labelForAgent(currentAgent),
              to:   labelForAgent(bridgeTarget)
            })}
          </p>
        )}
      </div>
    );
  }

  // ---------- PlanTab ----------
  function PlanTab({ state, setActive }) {
    const t = useT();
    const lang = useLang();
    if (!canComputeRRS(state)) {
      return <EmptyClinical
        eyebrow={t('empty.plan.eyebrow')}
        title={t('empty.plan.title')}
        message={t('empty.plan.body')}
        setActive={setActive} />;
    }

    const rrs = useMemo(() => computeRRS(state, lang), [state, lang]);
    const rx  = useMemo(() => computeMaintenanceRx(state, rrs, lang), [state, rrs, lang]);
    const b   = rrsBucket(rrs.pHold12m, lang);

    return (
      <section className="px-5 md:px-8 py-14 md:py-20">
        <div className="max-w-[1240px] mx-auto">
          <div className="screen-only">
          <div className="eyebrow mb-6">{t('plan.eyebrow')}</div>
          <h1 className="display text-[36px] md:text-[56px] max-w-[900px]">
            {t('plan.title')}
          </h1>
          <p className="mt-6 max-w-[720px] text-[15.5px] md:text-[16px] leading-[1.65]" style={{color:'var(--nn-ink-soft)'}}>
            {t('plan.body')}
          </p>

          {/* Strategy banner */}
          <div className="mt-12 hair-top pt-12">
            <div className="eyebrow mb-3">
              {t('plan.strategy.eyebrow')}
            </div>
            <div className="grid md:grid-cols-12 gap-8">
              <div className="md:col-span-7">
                <div className="flex items-center gap-3 mb-4">
                  <span className={`risk-pill`}><span className={`dot dot-${rx.strategy.tone}`}/>{rx.strategy.label}</span>
                  <span className="text-[12px]" style={{color:'var(--nn-ink-dim)'}}>·</span>
                  <span className={`risk-pill`}><span className={`dot dot-${b.cls}`}/>{b.label}</span>
                </div>
                <h2 className="text-[24px] md:text-[30px] font-semibold leading-tight tracking-tight" style={{color:'var(--nn-navy)'}}>
                  {rx.strategy.headline}
                </h2>
                <p className="mt-4 max-w-[640px] text-[14.5px] leading-[1.7]" style={{color:'var(--nn-ink-soft)'}}>
                  {rx.strategy.rationale}
                </p>
              </div>
              <div className="md:col-span-5">
                <div className="border p-5" style={{borderColor:'var(--nn-hair)'}}>
                  <div className="eyebrow mb-3">{t('plan.glance.title')}</div>
                  <dl className="space-y-2.5 text-[13.5px]">
                    <Row label={t('plan.glance.agent')}>{labelForAgent(state.agent)}</Row>
                    <Row label={t('plan.glance.weeks')}>{state.weeksOnTx || '—'}</Row>
                    <Row label={t('plan.glance.stop')}>{state.planningToStop ? t('plan.glance.yes') : t('plan.glance.no')}</Row>
                    <Row label={t('plan.glance.oral')}>{state.oralPreference ? t('plan.glance.yes') : t('plan.glance.no')}</Row>
                    <Row label={t('plan.glance.cost')}>{state.costConstrained ? t('plan.glance.yes') : t('plan.glance.no')}</Row>
                  </dl>
                </div>
              </div>
            </div>

            {/* Portfolio lineup — makes the portfolio-aware claim visually true. */}
            <AgentLineup currentAgent={state.agent} strategy={rx.strategy} />
          </div>

          {/* Alerts */}
          {rx.alerts.length > 0 && (
            <div className="mt-10 grid md:grid-cols-2 gap-4">
              {rx.alerts.map((a, i) => (
                <div key={i} className="border-l-2 p-4 md:p-5"
                     style={{
                       borderColor: a.tone === 'bad' ? 'var(--nn-bad)' : a.tone === 'warn' ? 'var(--nn-warn)' : a.tone === 'good' ? 'var(--nn-good)' : 'var(--nn-blue)'
                     }}>
                  <div className="text-[13px] font-semibold mb-1" style={{color:'var(--nn-navy)'}}>{a.title}</div>
                  <div className="text-[13px] leading-[1.55]" style={{color:'var(--nn-ink-soft)'}}>{a.body}</div>
                </div>
              ))}
            </div>
          )}

          {/* Taper schedule */}
          <div className="mt-14 hair-top pt-12">
            <div className="eyebrow mb-3">{t('plan.taper.eyebrow')}</div>
            <h2 className="text-[24px] md:text-[28px] font-semibold tracking-tight mb-2" style={{color:'var(--nn-navy)'}}>
              {t('plan.taper.title')}
            </h2>
            <p className="text-[14.5px] max-w-[700px] mb-8" style={{color:'var(--nn-ink-soft)'}}>
              {t('plan.taper.body')}
            </p>
            <div className="border" style={{borderColor:'var(--nn-hair)'}}>
              <div className="grid grid-cols-12 px-5 py-3 hair-bottom text-[10.5px] uppercase tracking-[0.14em]" style={{color:'var(--nn-ink-dim)', background:'var(--nn-bg-2)'}}>
                <div className="col-span-3">{t('plan.taper.col.period')}</div>
                <div className="col-span-4">{t('plan.taper.col.dose')}</div>
                <div className="col-span-5">{t('plan.taper.col.note')}</div>
              </div>
              {rx.strategy.steps.map((step, i) => (
                <div key={i} className="grid grid-cols-12 px-5 py-4 text-[13.5px]"
                     style={{borderBottom: i === rx.strategy.steps.length - 1 ? 'none' : '1px solid var(--nn-hair-2)'}}>
                  <div className="col-span-3 num" style={{color:'var(--nn-navy)'}}>{step.weeks}</div>
                  <div className="col-span-4 num font-semibold" style={{color:'var(--nn-ink)'}}>{step.dose}</div>
                  <div className="col-span-5" style={{color:'var(--nn-ink-soft)'}}>{step.note}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Lifestyle prescription */}
          <div className="mt-14 hair-top pt-12">
            <div className="eyebrow mb-3">{t('plan.life.eyebrow')}</div>
            <h2 className="text-[24px] md:text-[28px] font-semibold tracking-tight mb-2" style={{color:'var(--nn-navy)'}}>
              {t('plan.life.title')}
            </h2>
            <p className="text-[14.5px] max-w-[700px] mb-8" style={{color:'var(--nn-ink-soft)'}}>
              {t('plan.life.body')}
            </p>
            <div className="grid md:grid-cols-3 gap-8 md:gap-12">
              <LifestyleStat
                label={t('plan.life.protein')}
                figure={rx.lifestyle.proteinFloor.toFixed(1)}
                unit={t('plan.life.protein.unit')}
                aside={rx.lifestyle.proteinGrams ? t('plan.life.protein.aside', { g: rx.lifestyle.proteinGrams }) : null}
                reasons={rx.lifestyle.proteinReasons}/>
              <LifestyleStat
                label={t('plan.life.rt')}
                figure={rx.lifestyle.rtTarget}
                unit={t('plan.life.rt.unit')}
                reasons={[rx.lifestyle.rtReason]}/>
              <LifestyleStat
                label={t('plan.life.sleep')}
                figure={rx.lifestyle.sleepTarget}
                unit={t('plan.life.sleep.unit')}
                reasons={[rx.lifestyle.sleepReason]}/>
            </div>
          </div>
