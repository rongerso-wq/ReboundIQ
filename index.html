  function labelForAgent(key) {
    const map = { wegovy_sc:'Wegovy SC', wegovy_oral:'Wegovy pill', ozempic:'Ozempic', rybelsus:'Rybelsus', saxenda:'Saxenda', cagrisema:'CagriSema (filed)' };
    return map[key] || '—';
  }

  // ---------- AI Coach client plumbing ----------
  //
  // Goes same-origin to /api/coach. The Edge function holds the Anthropic
  // API key and proxies to api.anthropic.com. CSP stays at connect-src 'self'
  // because the browser never talks to Anthropic directly.

  const COACH_QUICKSTARTS = [
    "I'm tempted to stop my injections.",
    "I plateaued at 8% loss — what should I do?",
    "Why is protein so important right now?",
    "Explain my maintenance plan in plain terms."
  ];

  // Error messages live in STRINGS as `coach.err.{CODE}` keys (EN + HE).
  // postToCoachAPI throws `new Error(code)` and CoachTab resolves it via t().

  async function postToCoachAPI({ messages, patientContext }) {
    let res;
    try {
      res = await fetch('/api/coach', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ messages, patientContext })
      });
    } catch (e) {
      throw new Error('UPSTREAM_UNREACHABLE');
    }
    if (!res.ok) {
      let code = 'UPSTREAM_ERROR';
      try {
        const j = await res.json();
        if (j && j.error) code = String(j.error);
      } catch {}
      throw new Error(code);
    }
    return await res.json();
  }

  function buildPatientContext(state, rrs, rx) {
    const b = rrsBucket(rrs.pHold12m);
    return {
      bucket:         b.label,
      pHoldPct:       Math.round(rrs.pHold12m * 100),
      rebPct:         Math.round(rrs.rebound12m * 100),
      topDrivers:     rrs.topDrivers.map(d => d.label),
      strategy:       rx.strategy.label,
      proteinFloor:   rx.lifestyle.proteinFloor,
      rtTarget:       rx.lifestyle.rtTarget,
      agent:          labelForAgent(state.agent),
      planningToStop: !!state.planningToStop,
      sarcopenicFlag: !!rrs.sarcopenicFlag
    };
  }

  function coachWelcome(rrs, rx, lang, t) {
    const b = rrsBucket(rrs.pHold12m, lang);
    // Don't .toLowerCase() — drug names (Wegovy SC, CagriSema) and bucket
    // labels read better cased mid-sentence. Also no-op in Hebrew.
    return `${t('coach.welcome.prefix')} ${b.label} ${t('coach.welcome.middle')} "${rx.strategy.label}." ${t('coach.welcome.body')}\n\n${t('coach.welcome.prompt')}`;
  }

  // ---------- CoachTab ----------
  function CoachTab({ state, setActive }) {
    const t = useT();
    const lang = useLang();
    if (!canComputeRRS(state)) {
      return <EmptyClinical
        eyebrow={t('empty.coach.eyebrow')}
        title={t('empty.coach.title')}
        message={t('empty.coach.body')}
        setActive={setActive} />;
    }

    const rrs = useMemo(() => computeRRS(state, lang), [state, lang]);
    const rx  = useMemo(() => computeMaintenanceRx(state, rrs, lang), [state, rrs, lang]);

    const [messages, setMessages] = useState(() => [
      { role: 'assistant', content: coachWelcome(rrs, rx, lang, t) }
    ]);
    const [input,   setInput]   = useState('');
    const [loading, setLoading] = useState(false);
    const [error,   setError]   = useState(null);
    const threadRef = useRef(null);

    useEffect(() => {
      if (threadRef.current) {
        threadRef.current.scrollTop = threadRef.current.scrollHeight;
      }
    }, [messages, loading]);

    async function send(text) {
      const trimmed = (text || '').trim();
      if (!trimmed || loading) return;
      const userMsg = { role: 'user', content: trimmed };
      const next = [...messages, userMsg];
      setMessages(next);
      setInput('');
      setLoading(true);
      setError(null);
      try {
        const ctx = buildPatientContext(state, rrs, rx);
        // Edge function expects role: 'user' | 'assistant' only.
        const apiMessages = next.map(m => ({ role: m.role, content: m.content }));
        const { reply } = await postToCoachAPI({ messages: apiMessages, patientContext: ctx });
        setMessages(prev => [...prev, { role: 'assistant', content: reply }]);
      } catch (e) {
        setError(t('coach.err.' + e.message) || t('coach.err.UPSTREAM_ERROR'));
      } finally {
        setLoading(false);
      }
    }

    function clearConv() {
      setMessages([{ role: 'assistant', content: coachWelcome(rrs, rx, lang, t) }]);
      setError(null);
      setInput('');
    }

    function onKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send(input);
      }
    }

    const showQuickstarts = messages.length === 1 && !loading;
    const remaining = 4000 - input.length;
    const quickstarts = [t('coach.q.1'), t('coach.q.2'), t('coach.q.3'), t('coach.q.4')];

    return (
      <section className="px-5 md:px-8 py-14 md:py-20">
        <div className="max-w-[1240px] mx-auto">
          <div className="eyebrow mb-6">{t('coach.eyebrow')}</div>
          <h1 className="display text-[36px] md:text-[56px] max-w-[900px]">
            {t('coach.title')}
          </h1>
          <p className="mt-6 max-w-[720px] text-[15.5px] md:text-[16px] leading-[1.65]" style={{color:'var(--nn-ink-soft)'}}>
            {t('coach.body')}
          </p>

          {/* Disclosure */}
          <div className="mt-10 border-l-2 p-5" style={{borderColor:'var(--nn-blue)'}}>
            <div className="eyebrow mb-2" style={{color:'var(--nn-blue)'}}>{t('coach.disclosure.eyebrow')}</div>
            <p className="text-[13.5px] leading-[1.6]" style={{color:'var(--nn-ink-soft)'}}>
              {t('coach.disclosure.body')}
            </p>
          </div>

          {/* Thread */}
          <div className="mt-12 hair-top pt-10">
            <div className="coach-thread" ref={threadRef} aria-live="polite">
              {messages.map((m, i) => (
                <article key={i} className="coach-turn">
                  <div className={`coach-sender ${m.role === 'user' ? 'you' : 'coach'}`}>
                    {m.role === 'user' ? t('coach.you') : t('coach.coach')}
                  </div>
                  <div className="coach-content">{m.content}</div>
                </article>
              ))}
              {loading && (
                <article className="coach-turn">
                  <div className="coach-sender coach">{t('coach.coach')}</div>
                  <div className="coach-typing">
                    <span className="d"/><span className="d"/><span className="d"/>
                    <span className="ml-2">{t('coach.thinking')}</span>
                  </div>
                </article>
              )}
            </div>

            {/* Quickstarts */}
            {showQuickstarts && (
              <div className="mt-8">
                <div className="text-[11px] uppercase tracking-[0.14em] mb-4" style={{color:'var(--nn-ink-dim)'}}>{t('coach.quickstart.label')}</div>
                <div className="flex flex-wrap gap-2.5">
                  {quickstarts.map((q, i) => (
                    <button key={i} className="coach-quickstart" onClick={()=>send(q)} disabled={loading}>
                      {q}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Error */}
            {error && (
              <div className="mt-6 border-l-2 p-4 md:p-5" style={{borderColor:'var(--nn-bad)'}}>
                <div className="text-[13px] font-semibold mb-1" style={{color:'var(--nn-navy)'}}>{t('coach.error.title')}</div>
                <div className="text-[13.5px] leading-[1.55]" style={{color:'var(--nn-ink-soft)'}}>{error}</div>
              </div>
            )}

            {/* Input */}
            <div className="mt-8">
              <label className="field-label">{t('coach.input.label')}</label>
              <textarea
                className="coach-input"
                value={input}
                onChange={(e)=>setInput(e.target.value)}
                onKeyDown={onKeyDown}
                placeholder={t('coach.input.placeholder')}
                rows={3}
                maxLength={4000}
                disabled={loading}
                aria-label={t('coach.input.label')}
              />
              <div className="mt-3 flex flex-wrap items-center justify-between gap-3">
                <div className="text-[12px] num" style={{color: remaining < 200 ? 'var(--nn-bad)' : 'var(--nn-ink-dim)'}}>
                  {input.length} / 4000 · {t('coach.input.hint.pre')} <span className="num">{t('coach.input.hint.send')}</span> {t('coach.input.hint.to')} · <span className="num">{t('coach.input.hint.shift')}</span> {t('coach.input.hint.newline')}
                </div>
                <button className="btn btn-primary"
                        onClick={()=>send(input)}
                        disabled={loading || !input.trim()}
                        style={{opacity: loading || !input.trim() ? 0.5 : 1}}>
                  {loading ? t('coach.sending') : t('coach.send')}
                  <I.arrow style={{width:16, height:16}}/>
                </button>
              </div>
            </div>
          </div>

          {/* Footer */}
          <div className="hair-top mt-14 pt-8 flex flex-wrap items-center justify-between gap-5 text-[12px]" style={{color:'var(--nn-ink-dim)'}}>
            <div>
              {t('coach.powered')} Claude Sonnet 4.6 {t('coach.proxy')}
            </div>
            <div className="flex items-center gap-5">
              <button className="arrow-link" onClick={clearConv} disabled={loading}>
                {t('coach.clear')}
                <I.arrow style={{width:14,height:14}}/>
              </button>
              <button className="arrow-link" onClick={()=>setActive('plan')}>
                {t('coach.back')}
                <I.arrow style={{width:14,height:14}}/>
              </button>
            </div>
          </div>
        </div>
      </section>
    );
  }

    const enriched = useMemo(() => COHORT_PATIENTS.map(p => {
      const rrs = computeRRS(p.data, lang);
      const rx  = computeMaintenanceRx(p.data, rrs, lang);
      const b   = rrsBucket(rrs.pHold12m, lang);
      const baseW = Number(p.data.baselineWeightKg);

      return {
        ...p, rrs, rx, bucket: b,
        pHoldPct: Math.round(rrs.pHold12m * 100),
        lossPct: Math.round(lossPct * 10) / 10
      };
    }), [lang]);

    const sorted = useMemo(() => {
      const out = [...enriched];
      out.sort((a, b) => {
        let cmp = 0;
        if (sortKey === 'risk')    cmp = a.pHoldPct - b.pHoldPct; // ascending pHold = highest risk first
        if (sortKey === 'age')     cmp = a.data.age - b.data.age;
        if (sortKey === 'agent')   cmp = labelForAgent(a.data.agent).localeCompare(labelForAgent(b.data.agent));
        if (sortKey === 'weeks')   cmp = a.data.weeksOnTx - b.data.weeksOnTx;
        if (sortKey === 'lossPct') cmp = b.lossPct - a.lossPct; // descending by default
        return sortDir === 'asc' ? cmp : -cmp;
      });
      return out;
    }, [enriched, sortKey, sortDir]);

    function toggleSort(key) {
      if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
      else { setSortKey(key); setSortDir('asc'); }
    }

    function loadAndOpen(p) {
      loadDemo(p.data);
      setActive('risk');
    }

    // Distribution stats
    const lowN  = enriched.filter(p => p.bucket.key === 'low').length;
    const modN  = enriched.filter(p => p.bucket.key === 'mod').length;
    const highN = enriched.filter(p => p.bucket.key === 'high').length;

    const arrow = (key) => sortKey === key ? <span className="sort-arrow">{sortDir === 'asc' ? '↑' : '↓'}</span> : null;

    return (
      <section className="px-5 md:px-8 py-14 md:py-20">

          </div>

          {/* Cohort table */}
          <div className="mt-14 hair-top pt-12">
            <div className="eyebrow mb-3">{t('cohort.panel.eyebrow')}</div>
            <h2 className="text-[22px] md:text-[26px] font-semibold tracking-tight mb-6" style={{color:'var(--nn-navy)'}}>
              <span className="num">{enriched.length}</span> {t('cohort.panel.sortable')}
            </h2>

            <div className="border" style={{borderColor:'var(--nn-hair)', overflowX:'auto'}}>
              <table className="cohort-table">
                <thead>
                  <tr>
                    <th onClick={()=>toggleSort('risk')}>{t('cohort.col.risk')} {arrow('risk')}</th>
                    <th>{t('cohort.col.id')}</th>
                    <th onClick={()=>toggleSort('age')}>{t('cohort.col.age')} {arrow('age')}</th>
                    <th>{t('cohort.col.sex')}</th>
                    <th onClick={()=>toggleSort('agent')}>{t('cohort.col.agent')} {arrow('agent')}</th>
                    <th onClick={()=>toggleSort('weeks')}>{t('cohort.col.weeks')} {arrow('weeks')}</th>
                    <th onClick={()=>toggleSort('lossPct')}>{t('cohort.col.loss')} {arrow('lossPct')}</th>
                    <th>{t('cohort.col.phold')}</th>
                    <th>{t('cohort.col.strategy')}</th>
                  </tr>
                </thead>
                <tbody>
                  {sorted.map(p => (
                    <tr key={p.id} onClick={()=>loadAndOpen(p)} tabIndex={0}
                        role="button" aria-label={`Load ${p.id} ${p.initials}`}
                        onKeyDown={(e)=>{ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); loadAndOpen(p); } }}>
                      <td><span className="risk-pill"><span className={`dot dot-${p.bucket.cls}`}/>{p.bucket.label}</span></td>
                      <td className="col-num"><span style={{color:'var(--nn-ink-dim)'}}>{p.id}</span> <span style={{color:'var(--nn-navy)', fontWeight:600, marginLeft:6}}>{p.initials}</span></td>

                <div className="md:col-span-3 text-[12px] num tracking-[0.04em]" style={{color:'var(--nn-ink-dim)'}}>
                  <div>{r.year}</div>
                  <div className="mt-1" style={{color:'var(--nn-ink-soft)'}}>{r.journal}</div>
                </div>
                <div className="md:col-span-9">
                  <div className="text-[13px] font-semibold mb-1.5" style={{color:'var(--nn-navy)'}}>{r.authors}</div>
                  <div className="text-[16px] leading-snug mb-2.5" style={{color:'var(--nn-ink)'}}>{r.title}</div>
                  <div className="text-[14px] leading-[1.6] mb-3" style={{color:'var(--nn-ink-soft)'}}>{r.anchor}</div>
                  <div className="text-[12px] flex flex-wrap gap-x-5 gap-y-1">
                    <a href={r.url} target="_blank" rel="noopener noreferrer" className="arrow-link" style={{padding:0, fontSize:12}}>
                      {t('refs.open')}
                      <I.arrow style={{width:12,height:12}}/>
                    </a>
                    {r.pmid &&  <span className="num" style={{color:'var(--nn-ink-dim)'}}>PMID {r.pmid}</span>}
                    {r.pmcid && <span className="num" style={{color:'var(--nn-ink-dim)'}}>{r.pmcid}</span>}
                    {r.doi &&   <span className="num" style={{color:'var(--nn-ink-dim)'}}>DOI {r.doi}</span>}
                  </div>
                </div>
              </article>
            ))}
          </div>
        </div>
      </section>
    );
  }

  // ---------- Footer ----------
  function Footer() {
    const t = useT();
    return (
      <footer className="hair-top" style={{background:'var(--nn-bg-2)'}}>
        <div className="max-w-[1240px] mx-auto px-5 md:px-8 py-12 grid md:grid-cols-12 gap-8">
          <div className="md:col-span-4">
            <NovoMark />
            <p className="mt-5 text-[13px] leading-[1.65] max-w-[320px]" style={{color:'var(--nn-ink-soft)'}}>
              {t('footer.about')}
            </p>
          </div>
          <div className="md:col-span-5 grid grid-cols-2 gap-6 text-[13px]">
            <div>
              <div className="eyebrow mb-3">{t('footer.tool')}</div>
              <ul className="space-y-2" style={{color:'var(--nn-ink-soft)'}}>
                <li>{t('tab.home')}</li>
                <li>{t('tab.intake')}</li>
                <li>{t('tab.risk')}</li>
                <li>{t('tab.plan')}</li>
              </ul>
            </div>
            <div>
              <div className="eyebrow mb-3">{t('footer.reference')}</div>
              <ul className="space-y-2" style={{color:'var(--nn-ink-soft)'}}>
                <li>{t('tab.coach')}</li>
                <li>{t('tab.traj')}</li>
                <li>{t('tab.cohort')}</li>
                <li>{t('refs.eyebrow')}</li>
              </ul>
            </div>
          </div>
          <div className="md:col-span-3 text-[12px] leading-[1.7]" style={{color:'var(--nn-ink-dim)'}}>
            <div className="eyebrow mb-3" style={{color:'var(--nn-ink-soft)'}}>{t('footer.disclaimerHd')}</div>
            <p>{t('footer.disclaimerBody')}</p>
          </div>
        </div>
        <div className="hair-top">
          <div className="max-w-[1240px] mx-auto px-5 md:px-8 py-5 flex flex-wrap items-center justify-between gap-3 text-[11.5px]" style={{color:'var(--nn-ink-dim)'}}>
            <div className="num">{t('footer.year')}</div>
            <div className="flex items-center gap-2">
              <span>{t('footer.createdBy')}</span>
              <span className="signature">Roni Gershonovitch</span>
            </div>
          </div>
        </div>
      </footer>
    );
  }

  // ---------- App ----------
  function App() {
    const [mode, setMode]     = useState('hcp');
    const [active, setActive] = useState('home');
    const [data, setData]     = useState(INITIAL_STATE);
    const [lang, setLang]     = useState('en');

    const set         = (key, val) => setData(prev => ({ ...prev, [key]: val }));
    const loadDemo    = (demoData) => setData({ ...INITIAL_STATE, ...demoData });
    const resetState  = () => setData(INITIAL_STATE);

    const tabs = useMemo(() => TABS.filter(t => t.modes.includes(mode)), [mode]);

    useEffect(() => {
      if (!tabs.find(t => t.key === active)) setActive('home');
      document.body.className = `tab-${active} mode-${mode} lang-${lang}`;
      window.scrollTo({ top: 0, behavior: 'auto' });
    }, [active, mode, tabs, lang]);

    // Flip <html lang> + <html dir> when language changes — drives RTL CSS overrides.
    useEffect(() => {
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'he') ? 'rtl' : 'ltr';
    }, [lang]);

    const stubByKey = Object.fromEntries(FEATURES.map(f => [f.key, f]));

    // Localized labels for the live region and main aria-label.
    const t = (key) => {
      let s = STRINGS[lang]?.[key];
      if (s === undefined) s = STRINGS.en[key] ?? key;
      return s;
    };
    const activeTab = tabs.find(t => t.key === active) || { labelKey: 'tab.home' };
    const tabLabel = t(activeTab.labelKey || ('tab.' + activeTab.key));
    const modeLabel = mode === 'hcp' ? t('app.audience.hcp') : t('app.audience.patient');

    return (
      <LangContext.Provider value={lang}>
      <div className="min-h-screen flex flex-col bg-white">
        <a href="#main" className="skip-link no-print">{t('app.skip')}</a>
        <UtilityStrip mode={mode} setMode={setMode} lang={lang} setLang={setLang} />
        <Header tabs={tabs} active={active} setActive={setActive} />

        {/* Screen-reader announcement for tab + mode + language changes */}
        <div className="sr-only" role="status" aria-live="polite" aria-atomic="true">
          {tabLabel} · {modeLabel}
        </div>

        <main id="main" tabIndex={-1} className="flex-1 outline-none" aria-label={tabLabel}>
          {active === 'home'   && <HomeView mode={mode} setActive={setActive} />}
          {active === 'intake' && <IntakeTab state={data} set={set} setActive={setActive} loadDemo={loadDemo} resetState={resetState} />}
          {active === 'risk'   && <RiskTab state={data} setActive={setActive} />}
          {active === 'plan'   && <PlanTab state={data} setActive={setActive} />}
          {active === 'coach'  && <CoachTab state={data} setActive={setActive} />}
          {active === 'traj'   && <TrajectoryTab state={data} setActive={setActive} />}
          {active === 'refs'   && <RefsTab />}
          {active === 'cohort' && <CohortTab setActive={setActive} loadDemo={loadDemo} />}
          {active !== 'home' && active !== 'refs' && active !== 'intake' && active !== 'risk' && active !== 'plan' && active !== 'coach' && active !== 'traj' && active !== 'cohort' && stubByKey[active] && (
            <StubTab data={stubByKey[active]} setActive={setActive} />
          )}
        </main>

        <Footer />
      </div>
      </LangContext.Provider>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
